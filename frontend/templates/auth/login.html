{% extends "base.html" %}
{% block title %}Log in — RentalPro{% endblock %}
{% block auth_content %}
<h1>RentalPro</h1>
<p class="text-muted">Digital Rental Management System</p>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="field">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required autofocus>
  </div>
  <div class="field">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required>
  </div>
  <button class="btn" type="submit" style="width:100%">Log in</button>
</form>
<p class="mt-1"><a href="{{ url_for('auth.forgot_password') }}">Forgot your password?</a></p>
{% endblock %}
