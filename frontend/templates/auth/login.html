{% extends "base.html" %}
{% block title %}{{ _('Log in') }} — RentalPro{% endblock %}
{% block auth_content %}
<h1>{{ _('Log in') }}</h1>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="field">
    <label for="email">{{ _('Email') }}</label>
    <input type="email" id="email" name="email" required autofocus>
  </div>
  <div class="field">
    <label for="password">{{ _('Password') }}</label>
    <input type="password" id="password" name="password" required>
  </div>
  <button class="btn-block btn" type="submit">{{ _('Log in') }}</button>
</form>
<p class="mt-1"><a href="{{ url_for('auth.forgot_password') }}">{{ _('Forgot your password?') }}</a></p>
{% endblock %}
