{% extends "base.html" %}
{% block title %}Reset Password — RentalPro{% endblock %}
{% block auth_content %}
<h1>Choose a new password</h1>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="field">
    <label for="password">New password</label>
    <input type="password" id="password" name="password" minlength="8" required autofocus>
  </div>
  <button class="btn" type="submit" style="width:100%">Update password</button>
</form>
{% endblock %}
