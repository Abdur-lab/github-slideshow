{% extends "base.html" %}
{% block title %}Add Property — RentalPro{% endblock %}
{% block content %}
<h1>Add New Property</h1>
<div class="card" style="max-width:600px">
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="name">Property name</label>
      <input type="text" id="name" name="name" value="{{ form.get('name', '') }}" required>
    </div>
    <div class="field">
      <label for="address">Address</label>
      <input type="text" id="address" name="address" value="{{ form.get('address', '') }}" required>
    </div>
    <div class="grid grid-2">
      <div class="field">
        <label for="city">City</label>
        <input type="text" id="city" name="city" value="{{ form.get('city', '') }}" required>
      </div>
      <div class="field">
        <label for="country">Country</label>
        <input type="text" id="country" name="country" value="{{ form.get('country', '') }}" required>
      </div>
    </div>
    <div class="grid grid-2">
      <div class="field">
        <label for="type">Type</label>
        <select id="type" name="type">
          {% for t in types %}<option value="{{ t }}" {% if form.get('type') == t %}selected{% endif %}>{{ t.title() }}</option>{% endfor %}
        </select>
      </div>
      <div class="field">
        <label for="currency">Currency</label>
        <input type="text" id="currency" name="currency" value="{{ form.get('currency', 'USD') }}" maxlength="3">
      </div>
    </div>
    <div class="field">
      <label for="description">Description</label>
      <textarea id="description" name="description">{{ form.get('description', '') }}</textarea>
    </div>
    <button class="btn" type="submit">Save Property</button>
    <a href="{{ url_for('properties.index') }}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
