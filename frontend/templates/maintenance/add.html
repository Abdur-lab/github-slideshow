{% extends "base.html" %}
{% block title %}{{ _('Submit Maintenance Request') }} — RentalPro{% endblock %}
{% block content %}
<h1>{{ _('Submit Maintenance Request') }}</h1>
<div class="card-form card">
  <form method="post" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="title">{{ _('Title') }}</label>
      <input type="text" id="title" name="title" value="{{ form.get('title', '') }}" required>
    </div>
    <div class="grid grid-2">
      <div class="field">
        <label for="category">{{ _('Category') }}</label>
        <select id="category" name="category">
          {% for c in categories %}<option value="{{ c }}" {% if form.get('category') == c %}selected{% endif %}>{{ c|label }}</option>{% endfor %}
        </select>
      </div>
      <div class="field">
        <label for="severity">{{ _('Severity') }}</label>
        <select id="severity" name="severity">
          {% for s in severities %}<option value="{{ s }}" {% if form.get('severity') == s %}selected{% endif %}>{{ s|label }}</option>{% endfor %}
        </select>
      </div>
    </div>
    <div class="field">
      <label for="description">{{ _('Description') }}</label>
      <textarea id="description" name="description" required>{{ form.get('description', '') }}</textarea>
    </div>
    <div class="field">
      <label for="photos">{{ _('Photos (optional, up to 3, JPG/PNG, max 5 MB each)') }}</label>
      <input type="file" id="photos" name="photos" accept="image/jpeg,image/png" multiple>
    </div>
    <button class="btn" type="submit">{{ _('Submit Request') }}</button>
    <a href="{{ url_for('portal.index') }}" class="btn btn-secondary">{{ _('Cancel') }}</a>
  </form>
</div>
{% endblock %}
