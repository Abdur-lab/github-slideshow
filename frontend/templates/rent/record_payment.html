{% extends "base.html" %}
{% block title %}{{ _('Record Payment') }} — RentalPro{% endblock %}
{% block content %}
<h1>{{ _('Record Rent Payment') }}</h1>
<div class="card" style="max-width:600px">
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="lease_id">{{ _('Tenant') }}</label>
      <select id="lease_id" name="lease_id" required>
        <option value="">{{ _('Select a tenant…') }}</option>
        {% for l in active_leases %}
          <option value="{{ l.id }}" {% if lease and lease.id == l.id %}selected{% endif %}>
            {{ l.tenant.user.full_name }} — {{ l.unit.unit_code }} ({{ _('balance {amount}', amount="%.2f"|format(l.balance)) }})
          </option>
        {% endfor %}
      </select>
    </div>
    {% if lease %}<p class="text-muted">{{ _('Current balance:') }} <strong>{{ "%.2f"|format(lease.balance) }}</strong></p>{% endif %}
    <div class="grid grid-2">
      <div class="field">
        <label for="amount">{{ _('Amount') }}</label>
        <input type="number" step="0.01" id="amount" name="amount" required>
      </div>
      <div class="field">
        <label for="method">{{ _('Method') }}</label>
        <select id="method" name="method">
          {% for m in methods %}<option value="{{ m }}">{{ m|label }}</option>{% endfor %}
        </select>
      </div>
    </div>
    <div class="field">
      <label for="paid_at">{{ _('Payment date') }}</label>
      <input type="date" id="paid_at" name="paid_at">
    </div>
    <div class="field">
      <label for="notes">{{ _('Notes / reference (optional)') }}</label>
      <input type="text" id="notes" name="notes">
    </div>
    <button class="btn" type="submit">{{ _('Save Payment') }}</button>
    <a href="{{ url_for('rent.index') }}" class="btn btn-secondary">{{ _('Cancel') }}</a>
  </form>
</div>
{% endblock %}
